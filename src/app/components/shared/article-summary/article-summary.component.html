<div class="article-summary-wrapper" (click)="navigateToArticle(articleSummary?.id)">
    @if (articleSummary?.title) {
        <span [ngClass]="currentLang === 'en' ? 'article-title' : 'article-title hi'"> {{$any(articleSummary?.title)[currentLang] ?? ''}} </span>
    }
    @if (currentSubtitle) {
        <span [ngClass]="currentLang === 'en' ? 'article-subtitle' : 'article-subtitle hi'"> 
            @if (currentLang === 'en') {
                {{ currentSubtitle | customCapitalize }} 
            } @else {
                {{ currentSubtitle }} 
            }
        </span>
    }
    <span [ngClass]="currentLang === 'en' ? 'article-date' : 'article-date hi'"> {{$any(articleSummary?.publishedDate)[currentLang] ?? ''}} </span>
</div>
