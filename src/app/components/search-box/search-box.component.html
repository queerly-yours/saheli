<div class="search-box">
  <input
    type="text"
    [(ngModel)]="query"
    (keydown)="onKeydown($event)"
    [placeholder]="languageService.isEnglish() ? 'Search...' : 'खोजें...'"
    class="search-input"
    [class.search-input-hi]="!languageService.isEnglish()"
  />
  <button class="search-btn" (click)="onSearch()" aria-label="Search" type="button"></button>
</div>
